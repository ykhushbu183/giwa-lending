[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "cancun"

[fmt]
line_length = 120
number_underscore = "thousands"
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
giwa_sepolia = "https://sepolia-rpc.giwa.io"

[etherscan]
giwa_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://sepolia-explorer.giwa.io/api" }
